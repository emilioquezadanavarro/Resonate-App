{% extends "layout.html" %}

{% block content %}
<div class="max-w-3xl mx-auto pt-2 pb-12 px-4">
  <div class="max-w-md mx-auto mt-2 mb-12 p-8 bg-base-100 shadow-xl rounded-3xl border border-gray-100">

  <!-- Header -->
  <h1 class="text-3xl font-serif font-bold text-center text-gray-900 mb-4">
    Begin Your Journey
  </h1>
  <p class="text-center text-gray-500 mb-8 font-sans">
    Let's personalize your reflection space.
  </p>

  <form method="POST" class="space-y-6">

    <!-- Username -->
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold text-gray-600 text-sm">Username</span>
      </label>
      <input type="text" name="username" required class="input input-bordered w-full rounded-xl focus:border-primary" autocomplete="username">
    </div>

    <!-- First Name -->
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold text-gray-600 text-sm">First Name</span>
      </label>
      <input type="text" name="first_name" class="input input-bordered w-full rounded-xl focus:border-primary" autocomplete="given-name">
    </div>

    <!-- Last Name -->
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold text-gray-600 text-sm">Last Name</span>
      </label>
      <input type="text" name="last_name" class="input input-bordered w-full rounded-xl focus:border-primary" autocomplete="family-name">
    </div>

    <!-- Age -->
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold text-gray-600 text-sm">Age</span>
      </label>
      <input type="number" name="age" min="18" required class="input input-bordered w-full rounded-xl focus:border-primary">
    </div>

    <!-- Gender -->
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold text-gray-600 text-sm">Gender</span>
      </label>
      <select name="gender" class="select select-bordered w-full rounded-xl">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary btn-block rounded-xl text-lg mt-6">
      Start Journey
    </button>
  </form>

  </div>
</div>
{% endblock %}
