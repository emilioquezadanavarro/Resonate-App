{% extends "layout.html" %}
{% block content %}
<div class="max-w-3xl mx-auto pt-2 pb-12 px-4">

  <!-- Page Heading -->
  <h1 class="text-4xl font-serif font-bold text-gray-900 mb-4 text-center">New Journal Entry</h1>
  <div class="text-gray-500 mb-8 text-center font-sans text-lg">
    What's on your mind?
  </div>

  <!-- Journal Entry Form with Alpine.js -->
  <form method="POST" x-data="{ text: '{{ content if content else '' }}' }" class="space-y-8">

    <!-- Textarea & Counter -->
    <div>
      <textarea
        x-model="text"
        name="content"
        maxlength="500"
        required
        placeholder="Dear diary..."
        class="textarea textarea-bordered w-full h-64 text-lg p-6 rounded-2xl focus:border-primary focus:outline-none shadow-sm font-sans resize-none"
        aria-label="Journal Content"></textarea>
      <div class="text-right text-sm mt-2 font-sans"
           :class="text.length >= 500 ? 'text-error' : (text.length >= 400 ? 'text-warning' : 'text-gray-400')">
        <span x-text="text.length"></span> / 500 characters
      </div>
    </div>

    <!-- Mood Selection -->
    <div>
      <h3 class="text-gray-800 font-semibold text-lg mb-1 text-center font-sans">How are you feeling?</h3>
      <p class="text-gray-400 font-normal text-sm text-center mb-3">(Select all that apply)</p>
      <div class="flex flex-wrap justify-center gap-x-3 gap-y-4 mt-6">
        {% for mood in moods %}
          <div>
            <input
              type="checkbox"
              id="mood_{{ mood.id }}"
              name="moods"
              value="{{ mood.id }}"
              class="peer sr-only"
              {% if selected_moods and mood.id|string in selected_moods %}checked{% endif %}>
            <label
              for="mood_{{ mood.id }}"
              class="cursor-pointer px-5 py-2 rounded-full border border-gray-300 text-gray-600 transition hover:border-primary font-sans
                hover:bg-green-50 peer-checked:bg-primary peer-checked:bg-green-100 peer-checked:text-green-900 peer-checked:border-primary peer-checked:border-green-300 peer-checked:font-bold select-none text-base">
              {{ mood.label }}
            </label>
          </div>
        {% endfor %}
      </div>
    </div>

    <!-- Submit Button -->
    <div class="flex justify-center">
      <button type="submit" class="btn btn-primary btn-wide rounded-xl mt-6 font-sans text-lg font-semibold shadow-md">
        Save Entry
      </button>
    </div>
  </form>

</div>

<!-- Alpine.js - Already loaded in layout.html -->

{% endblock %}
