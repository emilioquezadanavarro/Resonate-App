<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Entry</title>
</head>
<body>

    <div style="padding: 20px;">
        <a href="{{ url_for('main.entry_detail', entry_id=entry.id) }}">← Cancel & Back</a>
    </div>

    <div style="max-width: 800px; margin: 0 auto; text-align: center;">
        <h1>✏️ Edit Entry</h1>
        <p style="color: gray;">{{ entry.created_at.strftime('%B %d, %Y') }}</p>

        <form method="POST">

            <textarea name="new_content" rows="15" cols="60" style="padding: 10px; font-size: 16px; width: 100%; box-sizing: border-box;" required>{{ entry.content }}</textarea>

            <div style="margin: 30px 0;">
                <h3 style="margin-bottom: 20px;">How are you feeling now? (Select all that apply)</h3>

                <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
                    {% for mood in moods %}
                        <div style="font-size: 18px; display: flex; align-items: center;">
                            <input type="checkbox" name="moods" value="{{ mood.id }}" id="mood_{{ mood.id }}" style="transform: scale(1.5); margin-right: 10px;"

                            {# Check the box if the entry already has this mood #}
                            {% if mood in entry.moods %}checked{% endif %}>

                            <label for="mood_{{ mood.id }}" style="cursor: pointer;">
                                {{ mood.label }} {{ mood.emoji }}
                            </label>
                        </div>
                    {% endfor %}
                </div>
            </div>
            <br><br>

            <button type="submit" style="padding: 15px 30px; font-size: 18px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;">
                💾 Save Changes
            </button>

        </form>
    </div>

</body>
</html>
