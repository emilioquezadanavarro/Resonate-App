{% extends "layout.html" %}

{% block content %}
<div class="max-w-3xl mx-auto pt-2 pb-12 px-4 space-y-8">

  <!-- Header -->
  <div class="text-center space-y-1">
    <h1 class="text-3xl md:text-4xl font-serif font-semibold text-gray-900 mb-4">
      ✏️ Edit Entry
    </h1>
    <p class="text-sm text-gray-500 font-sans">
      {{ entry.created_at.strftime('%B %d, %Y') }}
    </p>
  </div>

  <!-- Edit Form -->
  <form method="POST" x-data="{ text: {{ entry.content | tojson }} }" class="space-y-8">
    <!-- Textarea & Counter -->
    <div>
      <textarea
        x-ref="myContent"
        x-init="text = $refs.myContent.value"
        x-model="text"
        name="new_content"
        maxlength="500"
        required
        placeholder="Update your thoughts..."
        class="textarea textarea-bordered w-full h-64 text-lg p-6 rounded-2xl focus:border-primary focus:outline-none shadow-sm font-sans resize-none"
        aria-label="Updated journal content">{{ entry.content }}</textarea>
      <div class="text-right text-sm mt-2 font-sans"
           :class="text.length >= 500 ? 'text-error' : (text.length >= 400 ? 'text-warning' : 'text-gray-400')">
        <span x-text="text.length"></span> / 500 characters
      </div>
    </div>

    <!-- Mood Selection -->
    <div>
      <h3 class="text-gray-800 font-semibold text-lg mb-1 text-center font-sans">How are you feeling now?</h3>
      <p class="text-gray-400 font-normal text-sm text-center mb-3">(Select all that apply)</p>
      <div class="flex flex-wrap justify-center gap-x-3 gap-y-4 mt-6">
        {% for mood in moods %}
          <div>
            <input
              type="checkbox"
              id="mood_{{ mood.id }}"
              name="moods"
              value="{{ mood.id }}"
              class="peer sr-only"
              {% if mood in entry.moods %}checked{% endif %}>
            <label
              for="mood_{{ mood.id }}"
              class="cursor-pointer px-5 py-2 rounded-full border border-gray-300 text-gray-600 transition hover:border-primary font-sans
                hover:bg-green-50 peer-checked:bg-primary peer-checked:bg-green-100 peer-checked:text-green-900 peer-checked:border-primary peer-checked:border-green-300 peer-checked:font-bold select-none text-base">
              {{ mood.label }}
            </label>
          </div>
        {% endfor %}
      </div>
    </div>

    <!-- Save Button -->
    <button type="submit" class="btn btn-primary btn-wide rounded-xl mt-8 mx-auto block font-sans text-lg font-semibold shadow-md">
      Save Changes
    </button>

  </form>

</div>
{% endblock %}
