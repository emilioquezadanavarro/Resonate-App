{% extends "layout.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh] space-y-12">
    <!-- Hero Section -->
    <div class="text-center space-y-4">
        <h1 class="text-4xl md:text-5xl font-serif font-semibold text-gray-900">Welcome to Resonate</h1>
        <p class="text-lg md:text-xl text-gray-500 font-sans">
            Your AI-powered journaling companion.<br>
            Track your mood, write your thoughts, and discover music that matches your vibe.
        </p>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-md">
        <div class="card bg-white shadow-sm rounded-2xl px-8 py-8 flex flex-col items-center border border-gray-100">
            {% if users %}
                <form action="{{ url_for('main.login') }}" method="POST" class="w-full flex flex-col items-center space-y-5">
                    <label for="user_id" class="block text-base font-sans text-gray-600 mb-2">Select your profile</label>
                    <select id="user_id" name="user_id" required class="select select-bordered w-full text-base font-sans text-center">
                        <option value="" disabled selected>-- Select a profile 👤 --</option>
                        {% for user in users %}
                            <option value="{{ user.id }}">{{ user.username }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="btn btn-primary w-full rounded-2xl text-base font-sans mt-2 font-medium shadow-md flex items-center justify-center text-center">Login</button>
                </form>
                <div class="divider text-gray-400">or</div>
            {% endif %}
            <div class="w-full flex flex-col items-center">
                <span class="text-base font-sans text-gray-600 mb-3">New User?</span>
                <a href="{{ url_for('main.create_profile') }}" class="btn btn-outline w-full rounded-2xl text-base font-sans font-medium flex items-center justify-center text-center">
                    Create New Profile
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
