<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonate - Action Required</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f4f9; /* Soft grey background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
            border-top: 6px solid #d9534f; /* Red warning line */
        }
        h1 { color: #d9534f; margin-top: 0; }
        p { color: #555; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Entry Not Saved</h1>
        <p>
            We detected content that violates our Community Guidelines regarding
            <strong>hate speech or harassment</strong>.
        </p>
        <p>
            <strong>Resonate</strong> is a safe space for self-reflection. We do not allow content that promotes violence or hatred against individuals or groups.
        </p>

        <a href="{{ url_for('main.journal') }}" class="btn">Return to Journal</a>
    </div>

</body>
</html>
